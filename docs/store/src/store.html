<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store screenshots</title>
    <!--
      Render each shot at 1280×800:
      Chrome --headless --screenshot --window-size=1280,800 "store.html?lang=ja&shot=2"
      Shots: 1 hero, 2 what is in a note, 3 the notebook pieces, 4 the popup, 5 background sending.
      The video frames in note/ were blurred when captured; the note text is real plugin output.
    -->
    <style>
      :root {
        --bg: #fbfbfa;
        --ink: #1d1d1f;
        --mute: #6e6e73;
        --red: #b3261e;
        --paper: #f3f2ef;
        --font:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans',
          sans-serif;
        --lift:
          0 0 0 0.5px rgb(0 0 0 / 0.08), 0 30px 70px rgb(0 0 0 / 0.14), 0 6px 18px rgb(0 0 0 / 0.06);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
      }
      .shot {
        display: none;
        position: absolute;
        inset: 0;
      }
      .shot.on {
        display: block;
      }
      h1 {
        font-size: 46px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      p.lede {
        margin-top: 16px;
        color: var(--mute);
        font-size: 19px;
        line-height: 1.5;
        text-wrap: pretty;
      }
      :lang(zh) h1,
      :lang(ja) h1 {
        font-size: 40px;
        line-height: 1.28;
        letter-spacing: 0;
      }
      :lang(ja) :is(h1, p, .label) {
        word-break: auto-phrase;
      }
      .credit {
        position: absolute;
        bottom: 30px;
        left: 64px;
        color: var(--mute);
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      .credit b {
        color: var(--ink);
        font-weight: 600;
      }
      .sheet {
        position: absolute;
        overflow: hidden;
        border-radius: 12px;
        background: var(--paper) no-repeat 0 0 / 100% auto;
        box-shadow: var(--lift);
      }
      .label {
        position: absolute;
        width: 210px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        text-wrap: balance;
      }
      .label.left {
        text-align: right;
      }
      svg.lines {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 800px;
        overflow: visible;
        pointer-events: none;
      }
      .keys {
        display: flex;
        gap: 10px;
        margin-top: 34px;
      }
      .key {
        display: grid;
        place-items: center;
        width: 60px;
        height: 60px;
        border-radius: 14px;
        background: #fff;
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.1),
          0 1px 0 rgb(0 0 0 / 0.06),
          0 6px 16px rgb(0 0 0 / 0.08);
        font-size: 28px;
        font-weight: 500;
      }
      .toast {
        display: inline-block;
        margin-top: 26px;
        padding: 9px 18px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.95);
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.12),
          0 8px 28px rgb(0 0 0 / 0.14);
        font-size: 15px;
        font-weight: 500;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 22px;
      }
      .chip {
        padding: 4px 12px;
        border-radius: 999px;
        background: #efeeeb;
        font-size: 13px;
        font-weight: 500;
      }
      .tile {
        position: absolute;
      }
      .tile .sheet {
        position: relative;
      }
      .tile .cap {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
      }
      .pop {
        position: absolute;
        width: 340px;
        border-radius: 14px;
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.14),
          0 24px 60px rgb(0 0 0 / 0.18);
      }
    </style>
  </head>
  <body>
    <section class="shot" data-shot="1">
      <div
        style="position: absolute; top: 50%; left: 64px; width: 420px; transform: translateY(-50%)"
      >
        <h1 data-t="h1"></h1>
        <p class="lede" data-t="p1"></p>
        <div class="keys">
          <div class="key">⌘</div>
          <div class="key">⇧</div>
          <div class="key">S</div>
        </div>
        <div class="toast" data-t="toast"></div>
      </div>
      <div
        class="sheet"
        style="
          top: 150px;
          left: 548px;
          width: 820px;
          height: 540px;
          background-image: url(note/top.png);
          transform: rotate(-2deg);
          transform-origin: top left;
        "
      ></div>
    </section>

    <section class="shot" data-shot="2">
      <h1
        data-t="h2"
        style="position: absolute; top: 56px; left: 0; width: 1280px; text-align: center"
      ></h1>
      <div
        id="anat"
        class="sheet"
        style="
          top: 172px;
          left: 280px;
          width: 720px;
          height: 461px;
          background-image: url(note/top.png);
        "
      ></div>
      <svg class="lines" id="anat-lines"></svg>
    </section>

    <section class="shot" data-shot="3">
      <h1 data-t="h3" style="position: absolute; top: 56px; left: 64px; width: 1152px"></h1>
      <div class="tile" style="top: 162px; left: 64px; width: 560px">
        <div
          class="sheet"
          style="
            height: 150px;
            background: var(--paper) url(note/timeline.png) no-repeat 0 -8px / 100% auto;
          "
        ></div>
        <div class="cap" data-t="c-time"></div>
      </div>
      <div class="tile" style="top: 162px; left: 656px; width: 560px">
        <div
          class="sheet"
          style="
            height: 150px;
            background: var(--paper) url(note/receipts.png) no-repeat 0 -12px / 100% auto;
          "
        ></div>
        <div class="cap" data-t="c-quote"></div>
      </div>
      <div class="tile" style="top: 400px; left: 64px; width: 560px">
        <div class="sheet" style="height: 82px; background-image: url(note/sticky.png)"></div>
        <div class="cap" data-t="c-pin"></div>
      </div>
      <div class="tile" style="top: 400px; left: 656px; width: 560px">
        <div
          class="sheet"
          style="
            height: 82px;
            background: var(--paper) url(note/todo.png) no-repeat 0 -10px / 100% auto;
          "
        ></div>
        <div class="cap" data-t="c-todo"></div>
      </div>
      <div class="tile" style="top: 552px; left: 64px; width: 1152px">
        <div
          class="sheet"
          style="
            height: 66px;
            background: var(--paper) url(note/mermaid.png) no-repeat center / 100% auto;
          "
        ></div>
        <div class="cap" data-t="c-flow"></div>
      </div>
    </section>

    <section class="shot" data-shot="4">
      <div
        style="position: absolute; top: 50%; left: 64px; width: 420px; transform: translateY(-50%)"
      >
        <h1 data-t="h4"></h1>
        <p class="lede" data-t="p4"></p>
        <div class="chips">
          <span class="chip">YouTube</span><span class="chip">bilibili</span
          ><span class="chip" data-t="chip-lang"></span>
        </div>
      </div>
      <img class="pop" id="pop-a" alt="" style="top: 128px; left: 528px" />
      <img class="pop" id="pop-b" alt="" style="top: 184px; left: 892px" />
    </section>

    <section class="shot" data-shot="5">
      <div
        style="position: absolute; top: 50%; left: 64px; width: 420px; transform: translateY(-50%)"
      >
        <h1 data-t="h5"></h1>
        <p class="lede" data-t="p5"></p>
        <div class="toast" data-t="toast"></div>
      </div>
      <img class="pop" id="pop-s" alt="" style="top: 92px; left: 540px; width: 320px" />
      <img
        id="bridge"
        alt=""
        style="
          position: absolute;
          top: 300px;
          left: 812px;
          width: 420px;
          border-radius: 14px;
          box-shadow: var(--lift);
        "
      />
      <svg class="lines" id="pair-lines"></svg>
    </section>

    <div class="credit" data-t="credit"></div>

    <script>
      const COPY = {
        en: {
          lang: 'en',
          h1: 'One shortcut. A note worth rereading.',
          p1: 'Press ⌘⇧S on a YouTube or Bilibili video. The captions go to Obsidian, and your own model writes the note.',
          toast: 'Sent with captions',
          h2: 'Built to be reread.',
          a: [
            'The takeaway, in one red line',
            'Frames from the moments that matter',
            'Verdict and source, stamped',
            'The one point not to miss',
            'Every time jumps to that second',
          ],
          h3: 'Stories, next steps and quotes, kept on paper.',
          'c-time': 'The story as a timeline',
          'c-quote': 'Quotes with translation and time',
          'c-pin': 'Ideas pinned up',
          'c-todo': 'Next steps you can tick',
          'c-flow': 'The whole talk on one line',
          h4: 'One press sends the video, the moment and its captions.',
          p4: 'Light or dark, in your browser’s language.',
          'chip-lang': 'English · 中文 · 日本語',
          h5: 'Keep watching. Obsidian writes in the background.',
          p5: 'Optional: pair the extension with the plugin once, and Obsidian stays where it is.',
          credit:
            '<b>Video Summary</b> for Obsidian · Ithaca notebook look · notes from public talks, frames blurred',
          bridge: 'en',
        },
        zh_CN: {
          lang: 'zh',
          h1: '一个快捷键，一篇值得重读的笔记。',
          p1: '在 YouTube 或 B 站视频页按 ⌘⇧S，字幕送进 Obsidian，由你自己的模型写成笔记。',
          toast: '已连同字幕发送',
          h2: '做成值得重读的样子。',
          a: [
            '一句红笔结论',
            '关键时刻的画面',
            '评价和来源，盖章为证',
            '最不能错过的一点',
            '每个时间都能跳回那一秒',
          ],
          h3: '来龙去脉、下一步和原话，都落在纸上。',
          'c-time': '时间线讲清来龙去脉',
          'c-quote': '原话附翻译和时间',
          'c-pin': '想法钉在墙上',
          'c-todo': '能打勾的下一步',
          'c-flow': '整场演讲一条线',
          h4: '一键送出视频、此刻的时间和字幕。',
          p4: '浅色深色，跟着浏览器的语言。',
          'chip-lang': 'English · 中文 · 日本語',
          h5: '继续看视频，Obsidian 在后台写笔记。',
          p5: '可选：扩展和插件配对一次，Obsidian 就不会再跳到前台。',
          credit:
            'Obsidian 插件 <b>Video Summary</b> · Ithaca 手账外观 · 示例为公开演讲，画面已虚化',
          bridge: 'zh',
        },
        ja: {
          lang: 'ja',
          h1: 'ショートカットひとつで、読み返したくなるノートに。',
          p1: 'YouTube や bilibili の動画で ⌘⇧S。字幕が Obsidian に届き、あなたのモデルがノートを書きます。',
          toast: '字幕と一緒に送りました',
          h2: '読み返すためのノート。',
          a: [
            '結論は赤ペンで一行',
            '要所の場面をそのまま',
            '評価と出典をスタンプで',
            '見逃せない一点',
            '時刻を押せばその場面へ',
          ],
          h3: '流れも、次の一歩も、名言も、紙の上に。',
          'c-time': '流れは時系列カードで',
          'c-quote': '原文の引用に訳と時刻',
          'c-pin': 'アイデアは付箋に',
          'c-todo': 'チェックできる次の一歩',
          'c-flow': '話の流れを一本の線に',
          h4: 'ひと押しで、動画と再生位置と字幕を送る。',
          p4: 'ライトでもダークでも、ブラウザの言語で。',
          'chip-lang': 'English · 中文 · 日本語',
          h5: '動画はそのまま。ノートは裏で書き上がる。',
          p5: '任意：拡張機能とプラグインを一度ペアリングすれば、Obsidian は前に出てきません。',
          credit:
            'Obsidian プラグイン <b>Video Summary</b> · Ithaca ノートの見た目 · 例は公開講演、画面はぼかし済み',
          bridge: 'en',
        },
      };
      const q = new URLSearchParams(location.search);
      const lang = q.get('lang') || 'en';
      const shot = q.get('shot') || '1';
      const c = COPY[lang];
      document.documentElement.lang = c.lang;
      document.querySelector(`.shot[data-shot="${shot}"]`).classList.add('on');
      document.querySelectorAll('[data-t]').forEach((el) => {
        const v = c[el.dataset.t];
        if (el.dataset.t === 'credit') el.innerHTML = v;
        else el.textContent = v;
      });
      document.getElementById('pop-a').src = `popup/popup-current-${lang}-light.png`;
      document.getElementById('pop-b').src = `popup/popup-current-${lang}-dark.png`;
      document.getElementById('pop-s').src = `popup/popup-settings-${lang}-light.png`;
      document.getElementById('bridge').src = `note/bridge-settings-${c.bridge}.png`;

      const NS = 'http://www.w3.org/2000/svg';
      const RED = '#b3261e';
      function line(svg, x1, y1, x2, y2, dash, noDot) {
        const l = document.createElementNS(NS, 'path');
        l.setAttribute('d', `M${x1} ${y1} L${x2} ${y2}`);
        l.setAttribute('stroke', RED);
        l.setAttribute('stroke-width', '1.2');
        l.setAttribute('fill', 'none');
        if (dash) l.setAttribute('stroke-dasharray', '4 5');
        svg.appendChild(l);
        if (noDot) return;
        const d = document.createElementNS(NS, 'circle');
        d.setAttribute('cx', x2);
        d.setAttribute('cy', y2);
        d.setAttribute('r', '3.5');
        d.setAttribute('fill', RED);
        svg.appendChild(d);
      }
      /** A red-pen ring: two loose passes, as the notes draw it. */
      function ring(svg, cx, cy, rx, ry) {
        for (const [k, rot] of [
          [1, -4],
          [1.06, 3],
        ]) {
          const e = document.createElementNS(NS, 'ellipse');
          e.setAttribute('cx', cx);
          e.setAttribute('cy', cy);
          e.setAttribute('rx', rx * k);
          e.setAttribute('ry', ry * k);
          e.setAttribute('transform', `rotate(${rot} ${cx} ${cy})`);
          e.setAttribute('stroke', RED);
          e.setAttribute('stroke-width', '1.8');
          e.setAttribute('fill', 'none');
          e.setAttribute('opacity', k === 1 ? '0.95' : '0.55');
          svg.appendChild(e);
        }
      }
      function label(section, text, x, y, side) {
        const el = document.createElement('div');
        el.className = `label ${side}`;
        el.textContent = text;
        el.style.left = `${side === 'left' ? x - 210 : x}px`;
        el.style.top = `${y - 10}px`;
        section.appendChild(el);
      }

      if (shot === '2') {
        // Anchors as fractions of note/top.png (2072×1328), measured on the capture.
        const box = document.getElementById('anat').getBoundingClientRect();
        const at = (fx, fy) => [box.left + fx * box.width, box.top + fy * box.height];
        const svg = document.getElementById('anat-lines');
        const sec = svg.parentElement;
        const L = box.left - 28;
        const R = box.right + 28;
        const marks = [
          { a: at(0.06, 0.245), side: 'left', y: at(0, 0.245)[1] },
          { a: at(0.12, 0.43), side: 'left', y: at(0, 0.46)[1] },
          { a: at(0.86, 0.33), side: 'right', y: at(0, 0.3)[1] },
          { a: at(0.04, 0.84), side: 'left', y: at(0, 0.84)[1] },
          { a: at(0.343, 0.905), side: 'right', y: at(0, 0.97)[1] },
        ];
        marks.forEach((m, i) => {
          const x = m.side === 'left' ? L : R;
          label(sec, c.a[i], m.side === 'left' ? x - 10 : x + 10, m.y, m.side);
          // The last one ends at the red-pen ring instead of a dot.
          if (i === 4) line(svg, x, m.y, m.a[0] + 24, m.a[1] + 4, true, true);
          else line(svg, x, m.y, m.a[0], m.a[1]);
        });
        const t = at(0.343, 0.905);
        ring(svg, t[0], t[1], 22, 11);
      }
      if (shot === '5')
        window.addEventListener('load', () => {
          const svg = document.getElementById('pair-lines');
          const a = document.getElementById('pop-s').getBoundingClientRect();
          const b = document.getElementById('bridge').getBoundingClientRect();
          line(
            svg,
            a.right - 24,
            a.top + 196 * (a.width / 340),
            b.left + b.width * 0.5,
            b.top + b.height * 0.5,
            true,
          );
        });
    </script>
  </body>
</html>
