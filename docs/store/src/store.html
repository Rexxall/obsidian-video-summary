<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store screenshots</title>
    <!--
      Render each shot at 1280×800:
      Chrome --headless --allow-file-access-from-files --screenshot --window-size=1280,800 "store.html?lang=ja&shot=2"
      Shots: 1 the popup, 2 what is in a note, 3 who said what, 4 languages and dark paper, 5 background sending.
      The red-light look is shared with the Ithaca theme's store art.
      Notes in note/chalmers-*.png are unedited plugin output for David Chalmers's lecture at UC Berkeley
      (CC BY), rendered with the public Ithaca theme; the popups are the extension's own popup.html with demo data.
    -->
    <style>
      @font-face {
        font-family: IDisp;
        font-style: italic;
        src: url(fonts/BodoniModa-Italic.woff2);
      }
      :root {
        --red: #9a2a1b;
        --cream: #f5e6cf;
        --amber: #ecbf84;
        --mute: rgb(245 230 207 / 0.62);
        --lift: 0 4px 9px rgb(40 8 4 / 0.32), 0 33px 70px rgb(40 8 4 / 0.48);
        --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif;
        --label: 'DIN Condensed', 'PingFang SC', 'Hiragino Sans', sans-serif;
        --disp: IDisp, 'Songti SC', serif;
      }
      :lang(ja) {
        --disp: IDisp, 'Hiragino Mincho ProN', serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: var(--red);
        color: var(--cream);
        font-family: var(--sans);
      }
      /* Grain over everything, as on the theme's poster. */
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
        background-size: 384px;
      }
      .abs {
        position: absolute;
      }
      .shot {
        display: none;
        position: absolute;
        inset: 0;
      }
      .shot.on {
        display: block;
      }
      .sun {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle closest-side at 50% 50%,
          #ecbf84 0,
          #e1a868 62%,
          #d4925a 98.2%,
          rgb(154 42 27 / 0) 100%
        );
      }
      .num {
        position: absolute;
        top: 52px;
        left: 64px;
        color: var(--amber);
        font: 700 22px/1 var(--label);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      :is(:lang(zh), :lang(ja)) .num {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.2em;
      }
      .brand {
        position: absolute;
        top: 40px;
        right: 64px;
        z-index: 5;
        font:
          italic 400 30px/1 IDisp,
          serif;
        letter-spacing: -0.02em;
      }
      h1 {
        font: italic 400 64px/1.06 var(--disp);
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      :is(:lang(zh), :lang(ja)) h1 {
        font-style: normal;
        font-weight: 600;
        font-size: 50px;
        line-height: 1.32;
        letter-spacing: 0.02em;
      }
      :is(:lang(zh), :lang(ja)) h1.wide {
        font-size: 42px !important;
      }
      :lang(ja) :is(h1, .label) {
        word-break: auto-phrase;
      }
      .foot {
        position: absolute;
        bottom: 44px;
        left: 64px;
        color: var(--mute);
        font: 700 18px/1 var(--label);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .foot span {
        margin-left: 18px;
        letter-spacing: 0.06em;
        text-transform: none;
        font: 500 15px/1 var(--sans);
      }
      :is(:lang(zh), :lang(ja)) .foot {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.16em;
      }
      .sheet {
        position: absolute;
        overflow: hidden;
        border-radius: 12px;
        background: #f3f2ef no-repeat 0 0 / 100% auto;
        box-shadow: var(--lift);
      }
      .sheet::after,
      .pop::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow:
          inset 0 0 0 1px rgb(255 255 255 / 0.07),
          inset 0 1px 0 rgb(255 236 210 / 0.16);
      }
      .pop {
        position: absolute;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: var(--lift);
      }
      .sheet img {
        display: block;
        width: 100%;
      }
      .pop img {
        display: block;
        width: 100%;
      }
      .keys {
        display: flex;
        gap: 10px;
      }
      .key {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 13px;
        background: var(--cream);
        color: #7a2216;
        font:
          500 27px/1 -apple-system,
          sans-serif;
        box-shadow:
          0 1px 0 rgb(255 255 255 / 0.4) inset,
          0 3px 0 #c9a882,
          0 10px 22px rgb(40 8 4 / 0.35);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .chip {
        padding: 7px 16px;
        border: 1px solid rgb(245 230 207 / 0.4);
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        white-space: nowrap;
      }
      .tag {
        display: inline-block;
        padding: 9px 18px;
        border-radius: 999px;
        background: var(--cream);
        color: #7a2216;
        font: 600 16px/1 var(--sans);
        white-space: nowrap;
        box-shadow: 0 8px 22px rgb(40 8 4 / 0.3);
      }
      .label {
        position: absolute;
        width: 200px;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
        text-wrap: balance;
      }
      .label.left {
        text-align: right;
      }
      :lang(ja) .label {
        font-size: 16px;
      }
      .credit {
        position: absolute;
        bottom: 17px;
        left: 64px;
        color: rgb(245 230 207 / 0.5);
        font: 400 12px/1 var(--sans);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .crop img {
        position: absolute;
        max-width: none;
      }
      .lang {
        position: absolute;
        z-index: 3;
        padding: 6px 13px;
        border-radius: 999px;
        background: var(--cream);
        color: #7a2216;
        font: 600 14px/1 var(--sans);
        white-space: nowrap;
        box-shadow: 0 6px 16px rgb(40 8 4 / 0.3);
      }
      svg.lines {
        position: absolute;
        inset: 0;
        z-index: 4;
        width: 1280px;
        height: 800px;
        overflow: visible;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="brand">Video Summary</div>

    <section class="shot" data-shot="1">
      <div class="sun" style="left: 600px; top: 30px; width: 430px; height: 430px"></div>
      <div
        class="sheet note"
        style="left: 660px; top: 250px; width: 760px; height: 499px; transform: rotate(-4deg)"
      ></div>
      <div class="pop" style="left: 800px; top: 96px; width: 400px; transform: rotate(2deg)">
        <img id="pop-1" alt="" />
      </div>
      <h1 class="abs" data-t="h1" style="left: 62px; top: 196px; width: 540px"></h1>
      <div class="abs keys" style="left: 64px; top: 548px">
        <div class="key">⌘</div>
        <div class="key">⇧</div>
        <div class="key">S</div>
      </div>
    </section>

    <section class="shot" data-shot="2">
      <div class="sun" style="left: 900px; top: 470px; width: 330px; height: 330px"></div>
      <h1
        class="abs wide"
        data-t="h2"
        style="top: 92px; left: 0; width: 1280px; text-align: center; font-size: 50px"
      ></h1>
      <div
        class="sheet crop"
        id="head"
        style="left: 236px; top: 186px; transform: rotate(-1deg)"
      ></div>
      <div
        class="sheet crop"
        id="gist"
        style="left: 712px; top: 224px; transform: rotate(1.2deg)"
      ></div>
      <div
        class="sheet"
        id="claim-box"
        style="left: 600px; top: 470px; width: 600px; transform: rotate(-1.5deg)"
      >
        <img id="claim" alt="" />
      </div>
      <svg class="lines" id="anat-lines"></svg>
    </section>

    <section class="shot" data-shot="3">
      <div class="sun" style="left: 980px; top: 470px; width: 380px; height: 380px"></div>
      <h1 class="abs" data-t="h3" style="left: 62px; top: 210px; width: 430px"></h1>
      <div
        class="sheet"
        id="chat-box"
        style="left: 560px; top: 104px; width: 657px; height: 450px; transform: rotate(-1.5deg)"
      >
        <img id="chat" alt="" />
      </div>
      <div
        class="sheet"
        id="receipt-box"
        style="left: 470px; top: 430px; width: 449px; transform: rotate(3deg)"
      >
        <img id="receipt" alt="" />
      </div>
    </section>

    <section class="shot" data-shot="4">
      <div class="sun" style="left: 940px; top: 120px; width: 380px; height: 380px"></div>
      <h1
        class="abs wide"
        data-t="h4"
        style="top: 92px; left: 0; width: 1280px; text-align: center; font-size: 50px"
      ></h1>
      <div
        class="sheet crop sum"
        data-sum="en-light"
        style="left: 150px; top: 192px; transform: rotate(-1.2deg)"
      ></div>
      <div
        class="sheet crop sum"
        data-sum="zh_CN-light"
        style="left: 385px; top: 368px; transform: rotate(0.8deg)"
      ></div>
      <div
        class="sheet crop sum"
        data-sum="ja-dark"
        style="left: 620px; top: 538px; transform: rotate(-0.6deg)"
      ></div>
    </section>

    <section class="shot" data-shot="5">
      <div class="sun" style="left: 520px; top: 360px; width: 420px; height: 420px"></div>
      <h1 class="abs" data-t="h5" style="left: 62px; top: 200px; width: 430px"></h1>
      <div class="abs" style="left: 64px; top: 520px"><span class="tag" data-t="opt"></span></div>
      <div
        class="pop"
        style="left: 548px; top: 108px; width: 300px; height: 452px; transform: rotate(-2deg)"
      >
        <img id="pop-s" alt="" />
      </div>
      <div
        class="pop"
        id="bridge-box"
        style="left: 790px; top: 330px; width: 430px; border-radius: 14px; transform: rotate(2deg)"
      >
        <img id="bridge" alt="" />
      </div>
      <svg class="lines" id="pair-lines"></svg>
    </section>

    <div class="num" data-t="num"></div>
    <div class="foot"><b data-t="foot"></b><span>github.com/Rexxall/obsidian-ithaca</span></div>
    <div class="credit" data-t="credit"></div>

    <script>
      const COPY = {
        en: {
          lang: 'en',
          nums: [
            '01 · Capture',
            '02 · The note',
            '03 · Who said it',
            '04 · Languages',
            '05 · Background',
          ],
          h1: 'One press sends the lecture, the moment and its captions.',
          h2: '1 h 50 min of philosophy, one page you’ll reread.',
          a: [
            'The takeaway, in one red line',
            'Frames at the moments that matter',
            'The gist in a few lines',
            'A verdict, and where it came from',
            'The core claim, circled in red',
            'Every time jumps back to that second',
          ],
          h3: 'Who said what, in their own words.',
          h4: 'Your language, light or dark.',
          h5: 'Keep watching. Obsidian writes in the background.',
          opt: 'Optional · off by default',
          foot: 'Pairs with the Ithaca theme',
          credit:
            'Example: David Chalmers, Sarah Douglas Lecture in Philosophy and AI, UC Berkeley (CC BY)',
          bridge: 'en',
        },
        zh_CN: {
          lang: 'zh',
          nums: ['01 · 一键送出', '02 · 笔记', '03 · 原话', '04 · 语言', '05 · 后台发送'],
          h1: '一键送出讲座、此刻的时间和字幕。',
          h2: '1 小时 50 分钟的哲学课，一页愿意重读的笔记。',
          a: [
            '一句红笔结论',
            '关键时刻的画面',
            '几行讲清要点',
            '值不值得看，出自哪里',
            '核心论点，红笔圈出',
            '每个时间都能跳回那一秒',
          ],
          h3: '谁说了什么，原话都在。',
          h4: '跟着你的语言，浅色深色都行。',
          h5: '继续看视频，Obsidian 在后台写笔记。',
          opt: '可选 · 默认关闭',
          foot: '搭配 Ithaca 主题',
          credit:
            '示例：David Chalmers，Sarah Douglas Lecture in Philosophy and AI，UC Berkeley（CC BY）',
          bridge: 'zh',
        },
        ja: {
          lang: 'ja',
          nums: [
            '01 · ワンキー送信',
            '02 · ノート',
            '03 · 発言',
            '04 · 言語',
            '05 · バックグラウンド',
          ],
          h1: 'ひと押しで、講義と再生位置と字幕を送る。',
          h2: '1時間50分の哲学講義を、読み返したくなる一枚に。',
          a: [
            '結論は赤ペンで一行',
            '要所の場面をそのまま',
            '要点を数行で',
            '見る価値と出どころ',
            '核心の主張を赤丸で',
            '時刻から、その場面へ',
          ],
          h3: '誰が何を言ったか、本人の言葉で。',
          h4: 'あなたの言語で、ライトでもダークでも。',
          h5: '動画はそのまま。ノートは裏で書き上がる。',
          opt: '任意 · 初期設定はオフ',
          foot: 'Ithaca テーマと合わせて',
          credit:
            '例：David Chalmers「Sarah Douglas Lecture in Philosophy and AI」UC Berkeley（CC BY）',
          bridge: 'en',
        },
      };
      const q = new URLSearchParams(location.search);
      const lang = q.get('lang') || 'en';
      const shot = q.get('shot') || '1';
      const c = COPY[lang];
      c.num = c.nums[Number(shot) - 1];
      document.documentElement.lang = c.lang;
      document.querySelector(`.shot[data-shot="${shot}"]`).classList.add('on');
      document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = c[el.dataset.t]));
      document
        .querySelectorAll('.note')
        .forEach((el) => (el.style.backgroundImage = `url(note/chalmers-top-${lang}.png)`));
      document.getElementById('pop-1').src = `popup/popup-chalmers-${lang}.png`;
      document.getElementById('claim').src = `note/chalmers-claim-${lang}.png`;
      document.getElementById('chat').src = `note/chalmers-chat-${lang}.png`;
      document.getElementById('receipt').src = `note/chalmers-receipt-${lang}.png`;
      /** Shows source rectangle [x0,y0,x1,y1] of a 1080-wide strip at half size: body text stays 14 px. */
      const K = 0.5;
      function crop(box, src, [x0, y0, x1, y1]) {
        const img = new Image();
        img.src = src;
        img.style.width = `${1080 * K}px`;
        img.style.left = `${-x0 * K}px`;
        img.style.top = `${-y0 * K}px`;
        box.style.width = `${(x1 - x0) * K}px`;
        box.style.height = `${(y1 - y0) * K}px`;
        box.appendChild(img);
      }
      const STRIP = { en: 'en-light', zh_CN: 'zh_CN-light', ja: 'ja-dark' }[lang];
      const HEAD = {
        'en-light': [40, 180, 1060, 1200],
        'zh_CN-light': [40, 180, 1060, 1200],
        'ja-dark': [40, 180, 1060, 1250],
      };
      const SUM = {
        'en-light': [40, 1235, 1060, 1590],
        'zh_CN-light': [40, 1235, 1060, 1540],
        'ja-dark': [40, 1280, 1060, 1630],
      };
      const NAME = { 'en-light': 'English', 'zh_CN-light': '简体中文', 'ja-dark': '日本語' };
      if (shot === '2') {
        crop(document.getElementById('head'), `note/chalmers-strip-${STRIP}.png`, HEAD[STRIP]);
        crop(document.getElementById('gist'), `note/chalmers-strip-${STRIP}.png`, SUM[STRIP]);
      }
      document.querySelectorAll('[data-sum]').forEach((box) => {
        crop(box, `note/chalmers-strip-${box.dataset.sum}.png`, SUM[box.dataset.sum]);
        const tag = document.createElement('div');
        tag.className = 'lang';
        tag.textContent = NAME[box.dataset.sum];
        tag.style.left = `${parseFloat(box.style.left) + 470}px`;
        tag.style.top = `${parseFloat(box.style.top) - 14}px`;
        box.parentElement.appendChild(tag);
      });
      if (shot === '2')
        window.addEventListener('load', () => {
          // A point on a rotated box, as fractions of its unrotated size.
          const on = (el, deg, fx, fy) => {
            const r = el.getBoundingClientRect();
            const th = (deg * Math.PI) / 180;
            const dx = (fx - 0.5) * el.offsetWidth;
            const dy = (fy - 0.5) * el.offsetHeight;
            return [
              r.left + r.width / 2 + dx * Math.cos(th) - dy * Math.sin(th),
              r.top + r.height / 2 + dx * Math.sin(th) + dy * Math.cos(th),
            ];
          };
          const head = document.getElementById('head');
          const [hx0, hy0, hx1, hy1] = HEAD[STRIP];
          const onHead = (x, y) => on(head, -1, (x - hx0) / (hx1 - hx0), (y - hy0) / (hy1 - hy0));
          const gist = document.getElementById('gist');
          const claim = document.getElementById('claim-box');
          const TAKE = { en: [70, 520], zh_CN: [70, 520], ja: [70, 560] }[lang];
          const FRAME = { en: [70, 830], zh_CN: [70, 830], ja: [70, 860] }[lang];
          const TIME = { en: [0.615, 0.73], zh_CN: [0.29, 0.62], ja: [0.785, 0.74] }[lang];
          const svg = document.getElementById('anat-lines');
          const sec = svg.parentElement;
          const L = head.getBoundingClientRect().left - 18;
          const take = onHead(...TAKE);
          const frame = onHead(...FRAME);
          label(sec, c.a[0], L - 10, take[1], 'left');
          line(svg, L, take[1], take[0], take[1]);
          label(sec, c.a[1], L - 10, frame[1], 'left');
          line(svg, L, frame[1], frame[0], frame[1]);
          const g = on(gist, 1.2, 0.6, 0.02);
          const gl = document.createElement('div');
          gl.className = 'label';
          gl.textContent = c.a[2];
          gl.style.width = '300px';
          gl.style.left = `${g[0] - 20}px`;
          gl.style.top = `${g[1] - 44}px`;
          sec.appendChild(gl);
          const time = on(claim, -1.5, ...TIME);
          pointer(svg, time[0], time[1]);
          const tl = document.createElement('div');
          tl.className = 'label';
          tl.textContent = c.a[5];
          tl.style.width = '320px';
          tl.style.left = `${Math.min(time[0] - 10, 1216 - 320)}px`;
          tl.style.top = `${claim.getBoundingClientRect().bottom + 12}px`;
          sec.appendChild(tl);
        });
      if (shot === '3')
        window.addEventListener('load', () => {
          // A longer receipt (Chinese, Japanese) rises so it stays clear of the footer.
          const rb = document.getElementById('receipt-box');
          rb.style.top = `${Math.min(430, 712 - rb.offsetHeight)}px`;
        });
      if (shot === '5') document.querySelector('.credit').remove();

      const NS = 'http://www.w3.org/2000/svg';
      const LINE = '#ecbf84';
      const RED = '#b3261e';
      function line(svg, x1, y1, x2, y2, dash, dot = true) {
        const l = document.createElementNS(NS, 'path');
        l.setAttribute('d', `M${x1} ${y1} L${x2} ${y2}`);
        l.setAttribute('stroke', LINE);
        l.setAttribute('stroke-width', '1.4');
        l.setAttribute('fill', 'none');
        if (dash) l.setAttribute('stroke-dasharray', '4 5');
        svg.appendChild(l);
        if (!dot) return;
        const d = document.createElementNS(NS, 'circle');
        d.setAttribute('cx', x2);
        d.setAttribute('cy', y2);
        d.setAttribute('r', '4');
        d.setAttribute('fill', RED);
        d.setAttribute('stroke', '#fff7ec');
        d.setAttribute('stroke-width', '1.5');
        svg.appendChild(d);
      }
      /** A red-pen ring: two loose passes, as the notes draw it. */
      function ring(svg, cx, cy, rx, ry) {
        for (const [k, rot] of [
          [1, -4],
          [1.07, 3],
        ]) {
          const e = document.createElementNS(NS, 'ellipse');
          e.setAttribute('cx', cx);
          e.setAttribute('cy', cy);
          e.setAttribute('rx', rx * k);
          e.setAttribute('ry', ry * k);
          e.setAttribute('transform', `rotate(${rot} ${cx} ${cy})`);
          e.setAttribute('stroke', RED);
          e.setAttribute('stroke-width', '1.8');
          e.setAttribute('fill', 'none');
          e.setAttribute('opacity', k === 1 ? '0.95' : '0.55');
          svg.appendChild(e);
        }
      }
      function label(section, text, x, y, side) {
        const el = document.createElement('div');
        el.className = `label ${side}`;
        el.textContent = text;
        el.style.left = `${side === 'left' ? x - 200 : x}px`;
        el.style.top = `${y - 11}px`;
        section.appendChild(el);
      }

      /** A pointer, tip at (x, y). */
      function pointer(svg, x, y) {
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', `M${x} ${y} l0 21 l5.2 -5 l3.6 8.4 l3.4 -1.5 l-3.6 -8.2 l7.2 0 z`);
        p.setAttribute('fill', '#111');
        p.setAttribute('stroke', '#fff');
        p.setAttribute('stroke-width', '1.4');
        p.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(p);
      }

      if (shot === '5')
        window.addEventListener('load', () => {
          const svg = document.getElementById('pair-lines');
          const a = document.getElementById('pop-s').getBoundingClientRect();
