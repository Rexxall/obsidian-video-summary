<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store screenshot 1</title>
    <style>
      :root {
        --bg: #f3f1ec;
        --ink: #1d1d1f;
        --mute: #6e6e73;
        --accent: #b3261e;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
        color: var(--ink);
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 92px;
        width: 400px;
      }
      h1 {
        font-size: 44px;
        line-height: 1.08;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      p {
        margin-top: 18px;
        font-size: 19px;
        line-height: 1.45;
        color: var(--mute);
      }
      .keys {
        position: absolute;
        left: 72px;
        top: 420px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .key {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #fff;
        display: grid;
        place-items: center;
        font-size: 30px;
        font-weight: 500;
        box-shadow:
          0 1px 0 rgba(0, 0, 0, 0.08),
          0 6px 16px rgba(0, 0, 0, 0.08);
      }
      .toast {
        position: absolute;
        left: 72px;
        top: 520px;
        padding: 10px 14px;
        border-radius: 9px;
        background: #202124;
        color: #f4f1ff;
        border: 1px solid #8f7cf7;
        font-size: 15px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      }
      .arrow {
        position: absolute;
        left: 72px;
        top: 600px;
        font-size: 15px;
        color: var(--mute);
      }
      .shot {
        position: absolute;
        left: 520px;
        top: 80px;
        width: 704px;
        height: 640px;
        border-radius: 14px;
        overflow: hidden;
        background: url(note.jpg) no-repeat;
        background-size: 1249px 739px;
        background-position: -230px -84px;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.06),
          0 24px 60px rgba(0, 0, 0, 0.16);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>The video you're watching, as a note in your vault.</h1>
      <p>
        Press one shortcut on a YouTube page. The captions go to Obsidian, and your own model writes
        the note.
      </p>
    </div>
    <div class="keys">
      <div class="key">⌘</div>
      <div class="key">⇧</div>
      <div class="key">S</div>
    </div>
    <div class="toast">Sent with captions</div>
    <div class="arrow">No server. No account. About a minute.</div>
    <div class="shot"></div>
  </body>
</html>
