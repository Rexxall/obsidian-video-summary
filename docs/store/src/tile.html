<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store small promo tile</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: #fbfaf7;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        color: #1d1d1f;
      }
      img {
        position: absolute;
        left: 32px;
        top: 36px;
        width: 64px;
        height: 64px;
      }
      h1 {
        position: absolute;
        left: 32px;
        top: 124px;
        width: 380px;
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      .keys {
        position: absolute;
        left: 32px;
        bottom: 30px;
        font-size: 17px;
        color: #6e6e73;
      }
      .keys b {
        color: #1d1d1f;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="icon128.png" alt="" />
    <h1>Video to Obsidian note, in one shortcut.</h1>
    <div class="keys"><b>⌘⇧S</b> on YouTube · your own model key</div>
  </body>
</html>
