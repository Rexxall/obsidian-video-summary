<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Video Summary Capture</title>
    <style>
      /* Glass design, same tokens as the Obsidian plugin (see styles.css). The page is solid; the
         header the content scrolls under and the floating status are glass. Follows the system
         light/dark mode and falls back to solid surfaces under reduce transparency / more contrast. */
      :root {
        color-scheme: light dark;
        --accent: #7b6cd9;
        --on-accent: #ffffff;
        --accent-tint: color-mix(in srgb, var(--accent) 14%, transparent);
        --label: #1d1d1f;
        --label-2: #6e6e73;
        --label-3: #a1a1a6;
        --page: #ffffff;
        --group: color-mix(in srgb, var(--label) 4%, var(--page));
        --fill: color-mix(in srgb, var(--label) 7%, transparent);
        --fill-strong: color-mix(in srgb, var(--label) 12%, transparent);
        --sep: color-mix(in srgb, var(--label) 10%, transparent);
        --hair: 0 0 0 0.5px color-mix(in srgb, var(--label) 14%, transparent);
        --glass: color-mix(in srgb, var(--page) 68%, transparent);
        --glass-solid: color-mix(in srgb, var(--page) 96%, var(--label));
        --blur: blur(28px) saturate(170%);
        --glint: rgb(255 255 255 / 0.55);
        --ok: #248a3d;
        --warn: #c76c00;
        --err: #d70015;
        --shadow-1: var(--hair), 0 1px 2px rgb(0 0 0 / 0.05), 0 2px 8px rgb(0 0 0 / 0.04);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --font:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans',
          system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #9d8ff0;
          --on-accent: #16151f;
          --label: #f5f5f7;
          --label-2: #a1a1a6;
          --label-3: #6e6e73;
          --page: #1c1c1e;
          --glass: color-mix(in srgb, var(--page) 62%, transparent);
          --glint: rgb(255 255 255 / 0.16);
          --ok: #30d158;
          --warn: #ff9f0a;
          --err: #ff453a;
        }
      }
      @media (prefers-reduced-transparency: reduce) {
        :root {
          --glass: var(--glass-solid);
          --blur: none;
          --glint: transparent;
        }
      }
      @media (prefers-contrast: more) {
        :root {
          --glass: var(--page);
          --blur: none;
          --sep: color-mix(in srgb, var(--label) 32%, transparent);
          --fill: color-mix(in srgb, var(--label) 14%, transparent);
          --hair: 0 0 0 1px color-mix(in srgb, var(--label) 40%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        width: 380px;
        min-height: 420px;
        margin: 0;
        background: var(--page);
        color: var(--label);
        font: 13px/18px var(--font);
        -webkit-font-smoothing: antialiased;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px 10px;
        background: var(--glass);
        -webkit-backdrop-filter: var(--blur);
        backdrop-filter: var(--blur);
        box-shadow: inset 0 -0.5px 0 var(--sep);
      }
      h1 {
        margin: 0;
        font: 600 17px/22px var(--font);
      }
      .subtle {
        color: var(--label-2);
        font-size: 11px;
      }
      main {
        padding: 12px 16px 14px;
      }

      .view {
        display: none;
      }
      .view.active {
        display: block;
      }

      /* 文字链接、返回 */
      .link,
      .tab {
        appearance: none;
        width: auto;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font: 500 12px/16px var(--font);
      }
      .link:hover,
      .tab:hover {
        opacity: 0.8;
      }
      .back {
        display: inline-block;
        margin-bottom: 10px;
      }
      .back::before {
        content: '‹ ';
      }

      /* 当前视频：实底卡片 */
      .card {
        padding: 14px 16px 16px;
        border-radius: 16px;
        background: var(--page);
        box-shadow: var(--shadow-1);
      }
      .title {
        margin-bottom: 6px;
        font: 600 15px/20px var(--font);
        overflow-wrap: anywhere;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        color: var(--label-2);
        font-size: 11px;
      }
      .meta .time {
        color: var(--label);
        font:
          600 11px/14px ui-rounded,
          'SF Pro Rounded',
          var(--font);
        font-variant-numeric: tabular-nums;
      }

      /* 按钮：胶囊 */
      button.primary {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 10px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.25);
        color: var(--on-accent);
        cursor: pointer;
        font: 600 14px/20px var(--font);
        transition:
          background 120ms var(--ease),
          transform 120ms var(--ease);
      }
      button.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, black);
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
        transform: none;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .actions button,
      button.secondary {
        flex: 1 1 auto;
        width: auto;
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        background: var(--fill);
        color: var(--label);
        cursor: pointer;
        font: 500 12px/16px var(--font);
        white-space: nowrap;
        transition: background 120ms var(--ease);
      }
      .actions button:hover,
      button.secondary:hover {
        background: var(--fill-strong);
      }
      button.danger {
        color: var(--err);
      }

      details.more {
        margin-top: 12px;
      }
      details.more > summary {
        list-style: none;
        cursor: pointer;
        color: var(--label-2);
        font-size: 12px;
      }
      details.more > summary::-webkit-details-marker {
        display: none;
      }
      details.more > summary::before {
        content: '› ';
        display: inline-block;
        transition: transform 120ms var(--ease);
      }
      details.more[open] > summary::before {
        transform: rotate(90deg);
      }
      details.more .actions {
        margin-top: 8px;
      }

      /* 区块标题在组外，列表是分组 */
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 20px 4px 8px;
      }
      .section-title {
        font: 600 13px/16px var(--font);
      }
      .list {
        max-height: 230px;
        overflow-y: auto;
        border-radius: 12px;
        background: var(--group);
        box-shadow: var(--hair);
      }
      .row {
        position: relative;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 9px 16px;
      }
      .row + .row::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        left: 16px;
        border-top: 0.5px solid var(--sep);
      }
      .row-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-meta {
        color: var(--label-2);
        font-size: 11px;
      }
      .row button {
        width: auto;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font: 500 12px/16px var(--font);
      }
      .row button.danger {
        color: var(--label-3);
      }
      .row button.danger:hover {
        color: var(--err);
      }
      .platform {
        color: var(--label-2);
        font-size: 11px;
      }
      .platform.error {
        color: var(--err);
      }
      .platform.warning {
        color: var(--warn);
      }
      .empty {
        padding: 16px;
        color: var(--label-2);
        font-size: 12px;
        text-align: center;
      }
      .toolbar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }
      .toolbar button {
        flex: none;
      }

      /* 设置：组外小标题，组内每行标题在左、控件在右 */
      .group-title {
        margin: 20px 4px 8px;
        font: 600 13px/16px var(--font);
      }
      .group-title:first-of-type {
        margin-top: 4px;
      }
      .field {
        position: relative;
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 6px 16px;
        background: var(--group);
      }
      .field + .field::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        left: 16px;
        border-top: 0.5px solid var(--sep);
      }
      :not(.field) + .field {
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
      }
      .field:has(+ :not(.field)),
      .field:last-child {
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
      }
      .field label {
        color: var(--label);
        font-size: 13px;
      }
      .field.check {
        grid-template-columns: 1fr auto;
      }
      input,
      select {
        width: 100%;
        min-width: 0;
        padding: 6px 10px;
        border: 0;
        border-radius: 10px;
        background: var(--page);
        box-shadow: var(--hair);
        color: var(--label);
        font: 12px/16px var(--font);
      }
      input:focus,
      select:focus {
        outline: none;
        box-shadow:
          0 0 0 1px var(--accent),
          0 0 0 4px var(--accent-tint);
      }
      /* 开关：胶囊，按住时滑块拉长 */
      input[type='checkbox'] {
        appearance: none;
        position: relative;
        width: 40px;
        height: 24px;
        padding: 0;
        border-radius: 999px;
        background: var(--fill-strong);
        box-shadow: none;
        cursor: pointer;
        transition: background 200ms var(--ease);
      }
      input[type='checkbox']::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.22);
        transition:
          transform 200ms cubic-bezier(0.34, 1.36, 0.64, 1),
          width 120ms var(--ease);
      }
      input[type='checkbox']:active::after {
        width: 26px;
      }
      input[type='checkbox']:checked {
        background: var(--accent);
      }
      input[type='checkbox']:checked::after {
        transform: translateX(16px);
      }
      input[type='checkbox']:checked:active::after {
        transform: translateX(10px);
      }

      /* 底部 */
      footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin: 0 16px;
        padding: 10px 0 12px;
        border-top: 0.5px solid var(--sep);
      }
      footer .links {
        display: flex;
        gap: 12px;
      }
      .status {
        min-height: 18px;
        margin-top: 10px;
        color: var(--label-2);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .status.success {
        color: var(--ok);
      }
      .status.warning {
        color: var(--warn);
      }
      .status.error {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Video Summary Capture</h1>
      <span class="subtle" id="route-label"></span>
    </header>

    <main>
      <section class="view active" id="view-current">
        <div class="card">
          <div class="title" id="current-title">正在识别当前页面…</div>
          <div class="meta">
            <span id="current-platform"></span>
            <span class="time" id="current-time">--:--</span>
            <span id="current-url"></span>
          </div>
          <button class="primary" id="btn-current-quick">送去总结</button>
          <div class="actions">
            <button id="btn-current-pending">存为待看笔记</button>
            <button id="btn-current-copy">复制时间戳链接</button>
            <button id="btn-current-queue">加入队列</button>
          </div>
        </div>
        <details class="more">
          <summary>其他发送方式</summary>
          <div class="actions">
            <button id="btn-current-rest">经 REST 建笔记</button>
            <button id="btn-current-append">追加到链接清单</button>
            <button id="btn-current-n8n">直接发给 n8n</button>
            <button id="btn-current-codex">发给 Worker</button>
          </div>
        </details>

        <div class="section-head">
          <span class="section-title">队列 <span id="queue-count">0</span></span>
          <button class="tab link" data-view="queue">全部 →</button>
        </div>
        <div class="list" id="queue-preview">
          <div class="empty">队列是空的。</div>
        </div>
      </section>

      <section class="view" id="view-batch">
        <button class="tab link back" data-view="current">返回</button>
        <div class="toolbar">
          <div class="subtle">本页找到 <span id="batch-count">0</span> 个视频链接</div>
          <button class="secondary" id="btn-scan">重新扫描</button>
        </div>
        <div class="list" id="batch-list">
          <div class="empty">扫描当前页面里的视频链接。</div>
        </div>
        <button class="primary" id="btn-batch-quick">选中的送去总结</button>
        <div class="actions">
          <button id="btn-batch-queue">加入队列</button>
          <button id="btn-batch-pending">存为待看笔记</button>
          <button id="btn-batch-copy">复制链接</button>
        </div>
        <details class="more">
          <summary>其他发送方式</summary>
          <div class="actions">
            <button id="btn-batch-append">追加到链接清单</button>
            <button id="btn-batch-n8n">直接发给 n8n</button>
            <button id="btn-batch-codex">发给 Worker</button>
          </div>
        </details>
      </section>

      <section class="view" id="view-queue">
        <button class="tab link back" data-view="current">返回</button>
        <div class="toolbar">
          <div class="subtle">队列里有 <span id="queue-count-full">0</span> 个视频</div>
          <button class="secondary danger" id="btn-queue-clear">清空</button>
        </div>
        <div class="list" id="queue-list">
          <div class="empty">队列是空的。</div>
        </div>
        <button class="primary" id="btn-queue-quick">全部送去总结</button>
        <div class="actions">
          <button id="btn-queue-pending">存为待看笔记</button>
          <button id="btn-queue-copy">复制全部链接</button>
        </div>
        <details class="more">
          <summary>其他发送方式</summary>
          <div class="actions">
            <button id="btn-queue-append">追加到链接清单</button>
            <button id="btn-queue-n8n">直接发给 n8n</button>
            <button id="btn-queue-codex">发给 Worker</button>
          </div>
        </details>
      </section>

      <section class="view" id="view-history">
        <button class="tab link back" data-view="current">返回</button>
        <div class="toolbar">
          <div class="subtle">最近的操作</div>
          <button class="secondary danger" id="btn-history-clear">清空</button>
        </div>
        <div class="list" id="history-list">
          <div class="empty">还没有记录。</div>
        </div>
      </section>

      <section class="view" id="view-settings">
        <button class="tab link back" data-view="current">返回</button>
        <div class="group-title">送到哪里</div>
        <div class="field">
          <label for="setting-quick">“送去总结”</label>
          <select id="setting-quick">
            <option value="process-via-plugin">建笔记并交给插件处理</option>
            <option value="create-pending-note">只建待处理笔记（URI）</option>
            <option value="create-pending-rest">只建待处理笔记（REST）</option>
            <option value="send-to-n8n">直接发给 n8n</option>
            <option value="send-to-codex-worker">发给 Worker</option>
            <option value="append-link">追加时间戳链接</option>
            <option value="queue">加入队列</option>
          </select>
        </div>
        <div class="field">
          <label for="setting-vault">库名</label>
          <input id="setting-vault" placeholder="Ithaca" />
        </div>
        <div class="field">
          <label for="setting-folder">新笔记文件夹</label>
          <input id="setting-folder" placeholder="Videos" />
        </div>
        <div class="field">
          <label for="setting-append">链接清单文件</label>
          <input id="setting-append" placeholder="Inbox/VideoLinks.md" />
        </div>

        <div class="group-title">处理</div>
        <div class="field">
          <label for="setting-mode">处理方式</label>
          <select id="setting-mode">
            <option value="summary">完整总结</option>
            <option value="transcript-only">只要文稿</option>
            <option value="info-only">只要信息</option>
          </select>
        </div>
        <div class="field">
          <label for="setting-language">输出语言</label>
          <select id="setting-language">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </div>

        <div class="group-title">连接</div>
        <div class="field">
          <label for="setting-n8n">后端连接码</label>
          <input
            id="setting-n8n"
            type="password"
            autocomplete="off"
            placeholder="粘贴启动脚本给的连接码"
          />
        </div>
        <div class="field">
          <label for="btn-sync-bilibili">B 站登录</label>
          <button id="btn-sync-bilibili" type="button">同步到后端</button>
        </div>
        <div class="field">
          <label for="setting-webhook-format">请求格式</label>
          <select id="setting-webhook-format">
            <option value="unified">统一格式</option>
            <option value="legacy">旧版 Bridge</option>
          </select>
        </div>
        <div class="field">
          <label for="setting-codex">Worker 地址</label>
          <input id="setting-codex" />
        </div>
        <div class="field">
          <label for="setting-rest-protocol">REST 协议</label>
          <select id="setting-rest-protocol">
            <option value="https">https</option>
            <option value="http">http</option>
          </select>
        </div>
        <div class="field">
          <label for="setting-rest-port">REST 端口</label>
          <input id="setting-rest-port" type="number" />
        </div>
        <div class="field">
          <label for="setting-rest-token">REST 令牌</label>
          <input id="setting-rest-token" type="password" placeholder="只存在这台电脑上" />
        </div>

        <button class="primary" id="btn-save-settings">保存</button>
      </section>

      <div class="status" id="status"></div>
    </main>

    <footer>
      <button class="link" id="btn-open-batch">扫描本页视频链接</button>
      <span class="links">
        <button class="tab link" data-view="history">记录</button>
        <button class="tab link" data-view="settings">设置</button>
      </span>
    </footer>

    <script src="vendor/shared.global.js"></script>
    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
