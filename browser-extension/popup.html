<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Video Summary Capture</title>
    <style>
      /* Glass design, same tokens as the Obsidian plugin (see styles.css). The page is solid; the
         header the content scrolls under and the floating status are glass. Follows the system
         light/dark mode and falls back to solid surfaces under reduce transparency / more contrast. */
      :root {
        color-scheme: light dark;
        --accent: #7b6cd9;
        --on-accent: #ffffff;
        --accent-tint: color-mix(in srgb, var(--accent) 14%, transparent);
        --label: #1d1d1f;
        --label-2: #6e6e73;
        --label-3: #a1a1a6;
        --page: #ffffff;
        --group: color-mix(in srgb, var(--label) 4%, var(--page));
        --fill: color-mix(in srgb, var(--label) 7%, transparent);
        --fill-strong: color-mix(in srgb, var(--label) 12%, transparent);
        --sep: color-mix(in srgb, var(--label) 10%, transparent);
        --hair: 0 0 0 0.5px color-mix(in srgb, var(--label) 14%, transparent);
        --glass: color-mix(in srgb, var(--page) 68%, transparent);
        --glass-solid: color-mix(in srgb, var(--page) 96%, var(--label));
        --blur: blur(28px) saturate(170%);
        --glint: rgb(255 255 255 / 0.55);
        --ok: #248a3d;
        --warn: #c76c00;
        --err: #d70015;
        --shadow-1: var(--hair), 0 1px 2px rgb(0 0 0 / 0.05), 0 2px 8px rgb(0 0 0 / 0.04);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --font:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans',
          system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #9d8ff0;
          --on-accent: #16151f;
          --label: #f5f5f7;
          --label-2: #a1a1a6;
          --label-3: #6e6e73;
          --page: #1c1c1e;
          --glass: color-mix(in srgb, var(--page) 62%, transparent);
          --glint: rgb(255 255 255 / 0.16);
          --ok: #30d158;
          --warn: #ff9f0a;
          --err: #ff453a;
        }
      }
      @media (prefers-reduced-transparency: reduce) {
        :root {
          --glass: var(--glass-solid);
          --blur: none;
          --glint: transparent;
        }
      }
      @media (prefers-contrast: more) {
        :root {
          --glass: var(--page);
          --blur: none;
          --sep: color-mix(in srgb, var(--label) 32%, transparent);
          --fill: color-mix(in srgb, var(--label) 14%, transparent);
          --hair: 0 0 0 1px color-mix(in srgb, var(--label) 40%, transparent);
        }
      }
      /* Reduced motion keeps colour and opacity changes, drops movement. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-property: background-color, color, opacity !important;
        }
        button:active {
          transform: none !important;
        }
      }

      * {
        box-sizing: border-box;
      }
      ::selection {
        background: var(--accent-tint);
      }
      ::placeholder {
        color: var(--label-2);
        opacity: 1;
      }
      html {
        accent-color: var(--accent);
        caret-color: var(--accent);
        scrollbar-color: var(--fill-strong) transparent;
        scrollbar-width: thin;
      }
      summary:focus-visible {
        border-radius: 6px;
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* While a send is running every button waits, so nothing is sent twice. */
      body.busy main button {
        pointer-events: none;
        opacity: 0.45;
      }
      body {
        width: 380px;
        min-height: 360px;
        margin: 0;
        background: var(--page);
        color: var(--label);
        font: 13px/18px var(--font);
        -webkit-font-smoothing: antialiased;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 12px;
        background: var(--glass);
        -webkit-backdrop-filter: var(--blur);
        backdrop-filter: var(--blur);
        transition: box-shadow 160ms var(--ease);
      }
      /* The edge shows only once content scrolls under the header. */
      header.scrolled {
        box-shadow: inset 0 -0.5px 0 var(--sep);
      }
      h1 {
        margin: 0;
        font: 600 17px/22px var(--font);
        letter-spacing: -0.01em;
      }
      main {
        padding: 12px 16px 14px;
      }

      .view {
        display: none;
      }
      .view.active {
        display: block;
      }

      /* 文字链接、返回 */
      .link,
      .tab {
        appearance: none;
        width: auto;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font: 500 12px/16px var(--font);
      }
      .link:hover,
      .tab:hover {
        opacity: 0.8;
      }
      .link.danger {
        color: var(--err);
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .back::before {
        content: '';
        width: 7px;
        height: 7px;
        margin: 0 3px 0 2px;
        border-bottom: 1.6px solid currentColor;
        border-left: 1.6px solid currentColor;
        transform: rotate(45deg);
      }

      /* 当前视频：实底卡片 */
      .card {
        padding: 14px 16px 16px;
        border-radius: 16px;
        background: var(--page);
        box-shadow: var(--shadow-1);
      }
      .title {
        margin-bottom: 6px;
        font: 600 15px/20px var(--font);
        overflow-wrap: anywhere;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        color: var(--label-2);
        font-size: 11px;
      }
      .meta:empty,
      .meta span:empty {
        display: none;
      }
      /* 唯一一处签名：播放时间用 Didot 斜体 */
      .meta .time {
        color: var(--label);
        font:
          italic 400 15px/16px Didot,
          'Bodoni 72',
          Georgia,
          serif;
        font-variant-numeric: lining-nums tabular-nums;
      }
      .count {
        margin-left: 2px;
        color: var(--label-2);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      [hidden] {
        display: none !important;
      }

      /* 按钮：胶囊 */
      button.primary {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 10px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.25);
        color: var(--on-accent);
        cursor: pointer;
        font: 600 14px/20px var(--font);
        transition:
          background 120ms var(--ease),
          transform 120ms var(--ease);
      }
      button.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, black);
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
        transform: none;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .actions button,
      button.secondary {
        flex: 1 1 auto;
        width: auto;
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        background: var(--fill);
        color: var(--label);
        cursor: pointer;
        font: 500 12px/16px var(--font);
        white-space: nowrap;
        transition:
          background 120ms var(--ease),
          transform 140ms var(--ease);
      }
      .actions button:hover,
      button.secondary:hover {
        background: var(--fill-strong);
      }
      button.danger {
        color: var(--err);
      }

      details.more {
        margin-top: 12px;
      }
      details.more > summary {
        width: fit-content;
        padding: 2px 4px;
        list-style: none;
        cursor: pointer;
        color: var(--label-2);
        font-size: 12px;
      }
      details.more > summary::-webkit-details-marker {
        display: none;
      }
      details.more > summary::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 8px 1px 2px;
        border-right: 1.6px solid currentColor;
        border-bottom: 1.6px solid currentColor;
        transform: rotate(-45deg);
        transition: transform 160ms var(--ease);
      }
      details.more[open] > summary::before {
        transform: rotate(45deg) translate(-1px, -1px);
      }
      details.more .actions {
        margin-top: 8px;
      }

      /* 区块标题在组外，列表是分组 */
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 20px 4px 8px;
      }
      .section-head.first {
        margin-top: 4px;
      }
      .section-title {
        font: 600 13px/16px var(--font);
      }
      .list {
        max-height: 230px;
        overflow-y: auto;
        border-radius: 12px;
        background: var(--group);
        box-shadow: var(--hair);
      }
      .row {
        position: relative;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 9px 16px;
      }
      .row + .row::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        left: 16px;
        border-top: 0.5px solid var(--sep);
      }
      .row.two {
        grid-template-columns: minmax(0, 1fr) auto;
      }
      .row-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-meta {
        overflow: hidden;
        color: var(--label-2);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row button {
        width: auto;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font: 500 12px/16px var(--font);
      }
      .row button.danger {
        color: var(--label-2);
      }
      .row button.danger:hover {
        color: var(--err);
      }
      .state.error {
        color: var(--err);
      }
      .state.warning {
        color: var(--warn);
      }
      .empty {
        padding: 18px 20px;
        line-height: 17px;
        color: var(--label-2);
        font-size: 12px;
        text-align: center;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 20px;
        margin-bottom: 12px;
      }
      .toolbar button {
        flex: none;
      }

      /* 设置：组外小标题，组内每行标题在左、控件在右 */
      .group-title {
        margin: 20px 4px 8px;
        font: 600 13px/16px var(--font);
      }
      .group-title:first-of-type {
        margin-top: 4px;
      }
      .field {
        position: relative;
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 6px 16px;
        background: var(--group);
      }
      .field + .field::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        left: 16px;
        border-top: 0.5px solid var(--sep);
      }
      :not(.field) + .field {
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
      }
      .field:has(+ :not(.field)),
      .field:last-child {
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
      }
      .field label {
        color: var(--label);
        font-size: 13px;
      }
      .field.check {
        grid-template-columns: 1fr auto;
      }
      .field > button.inline {
        justify-self: end;
        padding: 5px 14px;
        border: 0;
        border-radius: 999px;
        background: var(--fill);
        color: var(--label);
        cursor: pointer;
        font: 500 12px/16px var(--font);
      }
      .field > button.inline:hover {
        background: var(--fill-strong);
      }
      details.advanced {
        margin-top: 0;
      }
      details.advanced > summary {
        margin: 20px 4px 8px;
        color: var(--label);
        font: 600 13px/16px var(--font);
      }
      details.advanced > summary + .field {
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
      }
      /* 列表里的勾选：圆形对勾，不用开关 */
      .row input[type='checkbox'] {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--label-3);
      }
      .row input[type='checkbox']::after {
        top: 5px;
        left: 7px;
        width: 5px;
        height: 9px;
        border-radius: 0;
        background: none;
        border-right: 2px solid var(--on-accent);
        border-bottom: 2px solid var(--on-accent);
        box-shadow: none;
        opacity: 0;
        transform: rotate(45deg);
        transition: opacity 120ms var(--ease);
      }
      .row input[type='checkbox']:checked {
        background: var(--accent);
        box-shadow: none;
      }
      .row input[type='checkbox']:checked::after,
      .row input[type='checkbox']:checked:active::after {
        width: 5px;
        opacity: 1;
        transform: rotate(45deg);
      }
      .row input[type='checkbox']:active::after {
        width: 5px;
      }
      input,
      select {
        width: 100%;
        min-width: 0;
        padding: 6px 10px;
        border: 0;
        border-radius: 10px;
        background: var(--page);
        box-shadow: var(--hair);
        color: var(--label);
        font: 12px/16px var(--font);
      }
      input:focus,
      select:focus {
        outline: none;
        box-shadow:
          0 0 0 1px var(--accent),
          0 0 0 4px var(--accent-tint);
      }
      /* 开关：胶囊，按住时滑块拉长 */
      input[type='checkbox'] {
        appearance: none;
        position: relative;
        width: 40px;
        height: 24px;
        padding: 0;
        border-radius: 999px;
        background: var(--fill-strong);
        box-shadow: none;
        cursor: pointer;
        transition: background 200ms var(--ease);
      }
      input[type='checkbox']::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.22);
        transition:
          transform 200ms cubic-bezier(0.34, 1.36, 0.64, 1),
          width 120ms var(--ease);
      }
      input[type='checkbox']:active::after {
        width: 26px;
      }
      input[type='checkbox']:checked {
        background: var(--accent);
      }
      input[type='checkbox']:checked::after {
        transform: translateX(16px);
      }
      input[type='checkbox']:checked:active::after {
        transform: translateX(10px);
      }

      /* 底部 */
      footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin: 0 16px;
        padding: 10px 0 12px;
        border-top: 0.5px solid var(--sep);
      }
      footer .links {
        display: flex;
        margin-left: auto;
        gap: 12px;
      }
      .status {
        min-height: 18px;
        margin-top: 10px;
        color: var(--label-2);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .status.success {
        color: var(--ok);
      }
      .status.warning {
        color: var(--warn);
      }
      .status.error {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-i18n="extName">Video Summary Capture</h1>
    </header>

    <main>
      <section class="view active" id="view-current">
        <div class="card" id="current-card">
          <div class="title" id="current-title" data-i18n="detecting">Reading this page…</div>
          <div class="meta">
            <span id="current-platform"></span>
            <span class="time" id="current-time"></span>
          </div>
          <div id="current-actions">
            <button class="primary" id="btn-current-quick" data-i18n="btnSummarize">
              Summarize in Obsidian
            </button>
            <div class="actions">
              <button id="btn-current-pending" data-i18n="savePending">Save for later</button>
              <button id="btn-current-copy" data-i18n="copyLink">Copy link</button>
              <button id="btn-current-queue" data-i18n="btnQueue">Add to queue</button>
            </div>
          </div>
          <button class="primary" id="btn-current-scan" data-i18n="scanPage" hidden>
            Find videos on this page
          </button>
        </div>
        <details class="more" id="current-more">
          <summary data-i18n="moreRoutes">Other ways to send</summary>
          <div class="actions">
            <button id="btn-current-rest" data-i18n="viaRest">Note via REST</button>
            <button id="btn-current-append" data-i18n="appendList">Append to list file</button>
            <button id="btn-current-n8n" data-i18n="sendN8n">Send to backend</button>
          </div>
        </details>

        <div class="section-head">
          <span class="section-title"
            ><span data-i18n="queue">Queue</span>
            <span class="count" id="queue-count">0</span></span
          >
          <button class="tab link" data-view="queue" id="queue-see-all" data-i18n="seeAll">
            See all
          </button>
        </div>
        <div class="list" id="queue-preview"></div>
      </section>

      <section class="view" id="view-batch">
        <div class="toolbar">
          <button class="tab link back" data-view="current" data-i18n="back">Back</button>
          <button class="link" id="btn-scan" data-i18n="rescan">Scan again</button>
        </div>
        <div class="section-head first">
          <span class="section-title"
            ><span data-i18n="foundLinks">Video links on this page</span>
            <span class="count" id="batch-count">0</span></span
          >
        </div>
        <div class="list" id="batch-list"></div>
        <div id="batch-actions">
          <button class="primary" id="btn-batch-quick" data-i18n="sendSelected">
            Send selected
          </button>
          <div class="actions">
            <button id="btn-batch-queue" data-i18n="queueSelected">Add to queue</button>
            <button id="btn-batch-pending" data-i18n="savePending">Save for later</button>
            <button id="btn-batch-copy" data-i18n="copyLinks">Copy links</button>
          </div>
          <details class="more">
            <summary data-i18n="moreRoutes">Other ways to send</summary>
            <div class="actions">
              <button id="btn-batch-append" data-i18n="appendList">Append to list file</button>
              <button id="btn-batch-n8n" data-i18n="sendN8n">Send to backend</button>
            </div>
          </details>
        </div>
      </section>

      <section class="view" id="view-queue">
        <div class="toolbar">
          <button class="tab link back" data-view="current" data-i18n="back">Back</button>
          <button class="link danger" id="btn-queue-clear" data-i18n="clear">Clear</button>
        </div>
        <div class="section-head first">
          <span class="section-title"
            ><span data-i18n="queue">Queue</span>
            <span class="count" id="queue-count-full">0</span></span
          >
        </div>
        <div class="list" id="queue-list"></div>
        <div id="queue-actions">
          <button class="primary" id="btn-queue-quick" data-i18n="sendAll">Send all</button>
          <div class="actions">
            <button id="btn-queue-pending" data-i18n="savePending">Save for later</button>
            <button id="btn-queue-copy" data-i18n="copyAllLinks">Copy all links</button>
          </div>
          <details class="more">
            <summary data-i18n="moreRoutes">Other ways to send</summary>
            <div class="actions">
              <button id="btn-queue-append" data-i18n="appendList">Append to list file</button>
              <button id="btn-queue-n8n" data-i18n="sendN8n">Send to backend</button>
            </div>
          </details>
        </div>
      </section>

      <section class="view" id="view-history">
        <div class="toolbar">
          <button class="tab link back" data-view="current" data-i18n="back">Back</button>
          <button class="link danger" id="btn-history-clear" data-i18n="clear">Clear</button>
        </div>
        <div class="section-head first">
          <span class="section-title" data-i18n="historyTitle">History</span>
        </div>
        <div class="list" id="history-list"></div>
      </section>

      <section class="view" id="view-settings">
        <div class="toolbar">
          <button class="tab link back" data-view="current" data-i18n="back">Back</button>
        </div>
        <div class="group-title" data-i18n="groupDestination">Destination</div>
        <div class="field">
          <label for="setting-quick" data-i18n="settingQuick">Main button</label>
          <select id="setting-quick">
            <option value="process-via-plugin" data-i18n="routePlugin">
              Note, then summarize in Obsidian
            </option>
            <option value="create-pending-note" data-i18n="routePendingUri">
              Pending note only
            </option>
            <option value="create-pending-rest" data-i18n="routePendingRest">
              Pending note only (REST)
            </option>
            <option value="send-to-n8n" data-i18n="routeN8n">Send to backend</option>
            <option value="append-link" data-i18n="routeAppend">Append to list file</option>
            <option value="queue" data-i18n="routeQueue">Add to queue</option>
          </select>
        </div>
        <div class="field check">
          <label for="setting-captions" data-i18n="settingCaptions">Send YouTube captions</label>
          <input id="setting-captions" type="checkbox" role="switch" />
        </div>
        <div class="field">
          <label for="setting-vault" data-i18n="settingVault">Vault</label>
          <input id="setting-vault" placeholder="My Vault" spellcheck="false" />
        </div>
        <div class="field">
          <label for="setting-folder" data-i18n="settingFolder">Folder</label>
          <input id="setting-folder" placeholder="Videos" spellcheck="false" />
        </div>
        <div class="field">
          <label for="setting-append" data-i18n="settingAppend">List file</label>
          <input id="setting-append" placeholder="Inbox/VideoLinks.md" spellcheck="false" />
        </div>

        <div class="group-title" data-i18n="groupProcessing">Processing</div>
        <div class="field">
          <label for="setting-mode" data-i18n="settingMode">Output</label>
          <select id="setting-mode">
            <option value="summary" data-i18n="modeSummary">Full summary</option>
            <option value="transcript-only" data-i18n="modeTranscript">Transcript only</option>
            <option value="info-only" data-i18n="modeInfo">Video info only</option>
          </select>
        </div>
        <div class="field">
          <label for="setting-language" data-i18n="settingLanguage">Language</label>
          <select id="setting-language">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </div>

        <div class="group-title" data-i18n="groupBackend">Backend</div>
        <div class="field">
          <label for="setting-n8n" data-i18n="settingBackend">Connection code</label>
          <input id="setting-n8n" type="password" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="btn-sync-bilibili" data-i18n="settingBilibili">Bilibili sign-in</label>
          <button class="inline" id="btn-sync-bilibili" type="button" data-i18n="syncToBackend">
            Sync
          </button>
        </div>

        <details class="more advanced">
          <summary data-i18n="advanced">Advanced</summary>
          <div class="field">
            <label for="setting-webhook-format" data-i18n="settingFormat">Request format</label>
            <select id="setting-webhook-format">
              <option value="unified" data-i18n="formatUnified">Unified</option>
              <option value="legacy" data-i18n="formatLegacy">Legacy bridge</option>
            </select>
          </div>
          <div class="field">
            <label for="setting-rest-protocol" data-i18n="settingRestProtocol">REST protocol</label>
            <select id="setting-rest-protocol">
              <option value="https">https</option>
              <option value="http">http</option>
            </select>
          </div>
          <div class="field">
            <label for="setting-rest-port" data-i18n="settingRestPort">REST port</label>
            <input id="setting-rest-port" type="number" min="1" max="65535" />
          </div>
          <div class="field">
            <label for="setting-rest-token" data-i18n="settingRestToken">REST token</label>
            <input
              id="setting-rest-token"
              type="password"
              autocomplete="off"
              data-i18n-placeholder="restTokenPlaceholder"
            />
          </div>
        </details>

        <button class="primary" id="btn-save-settings" data-i18n="save">Save</button>
      </section>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <footer>
      <button class="link" id="btn-open-batch" data-i18n="scanPage">
        Find videos on this page
      </button>
      <span class="links">
        <button class="tab link" data-view="history" data-i18n="history">History</button>
        <button class="tab link" data-view="settings" data-i18n="settings">Settings</button>
      </span>
    </footer>

    <script src="vendor/shared.global.js"></script>
    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
