<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Video Summary</title>
  <desc id="d">Video Summary turns a video link into an Obsidian note. A finished job for a TED talk sits above the note it wrote: a summary and key points.</desc>
  <rect width="1200" height="400" rx="28" fill="#F7F6FB"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif">
