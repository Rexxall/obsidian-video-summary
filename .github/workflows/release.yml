name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic-version tag to publish or retry
        required: true
        type: string

concurrency:
  group: video-summary-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  backend-image:
    # The prebuilt backend image the start script pulls, for Intel/AMD and Apple Silicon/ARM.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/rexxall/video-summary-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}

      - name: Check that the backend package points at this image
        run: |
          grep -qF "image: \${VS_IMAGE:-${IMAGE}:${RELEASE_VERSION}}" backend/compose.yaml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: backend-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Validate bundled workflow
        run: node tools/upgrade-workflow-v3.mjs --check

      - name: Build
        run: npm run build

      - name: Validate versions and committed bundle
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")"
          head_commit="$(git rev-parse "HEAD^{commit}")"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Checked-out ref is not tag $RELEASE_VERSION" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$head_commit" origin/main; then
            echo "Tag $RELEASE_VERSION is not reachable from origin/main" >&2
            exit 1
          fi

          # shellcheck disable=SC2016 # the single-quoted script is JavaScript, not shell
          node -e '
            const manifest = require("./manifest.json");
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            const versions = require("./versions.json");
            const tag = process.env.RELEASE_VERSION;
            const values = {
              manifest: manifest.version,
              package: pkg.version,
              lock: lock.version,
              lockRoot: lock.packages?.[""]?.version,
            };
            for (const [name, version] of Object.entries(values)) {
              if (version !== tag) {
                throw new Error(`${name} version ${version} does not match tag ${tag}`);
              }
            }
            if (versions[tag] !== manifest.minAppVersion) {
              throw new Error(
                `versions.json maps ${tag} to ${versions[tag]}, expected ${manifest.minAppVersion}`,
              );
            }
          '
          git diff --exit-code -- main.js

      # Obsidian reads only main.js, manifest.json and styles.css from the plugin release. The
      # backend and the browser extension ship in releases of their own (backend-v<version>,
      # capture-v<extension version>) so the plugin release carries nothing else.
      - name: Package backend and browser extension
        run: |
          backend_tag="backend-v${RELEASE_VERSION}"
          backend_archive="video-summary-backend-${RELEASE_VERSION}.zip"
          mkdir -p dist/backend dist/capture
          # Tracked files only, with their executable bits; .env and user files never ship.
          git archive --format=zip --prefix=video-summary-backend/ -o "dist/backend/$backend_archive" HEAD:backend
          unzip -l "dist/backend/$backend_archive" | grep -q 'video-summary-backend/.env.example'
          if unzip -Z1 "dist/backend/$backend_archive" | grep -E '/\.env$'; then
            echo "Backend archive must not contain .env" >&2
            exit 1
          fi
          (cd dist/backend && sha256sum "$backend_archive" > SHA256SUMS)

          extension_version="$(node -p "require('./browser-extension/manifest.json').version")"
          capture_tag="capture-v${extension_version}"
          extension_archive="video-summary-capture-${extension_version}.zip"
          (cd browser-extension && zip -qr "../dist/capture/$extension_archive" . -x 'README.md')
          (cd dist/capture && sha256sum "$extension_archive" > SHA256SUMS)

          {
            echo "BACKEND_TAG=$backend_tag"
            echo "BACKEND_ARCHIVE=$backend_archive"
            echo "CAPTURE_TAG=$capture_tag"
            echo "EXTENSION_VERSION=$extension_version"
            echo "EXTENSION_ARCHIVE=$extension_archive"
          } >> "$GITHUB_ENV"

      # Signed build provenance for every file the releases ship, as in Obsidian's example release
      # workflow; check one with: gh attestation verify main.js --repo Rexxall/obsidian-video-summary
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            dist/backend/${{ env.BACKEND_ARCHIVE }}
            dist/capture/${{ env.EXTENSION_ARCHIVE }}

      - name: Checkout current release publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling

      - name: Create or update GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          release_commit="$(git rev-parse HEAD)"

          # The backend and the extension never become "Latest", so releases/latest stays the plugin.
          publish_side_release() {
            local tag="$1" title="$2" notes="$3"
            shift 3
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$@" --clobber
            else
              gh release create "$tag" "$@" \
                --title "$title" \
                --notes "$notes" \
                --target "$release_commit" \
                --latest=false
            fi
          }

          publish_side_release "$BACKEND_TAG" "Video Summary backend ${RELEASE_VERSION}" \
            "Backend for Video Summary ${RELEASE_VERSION}. Unzip it outside your vault and run the start script; guide: ${repo_url}/blob/${RELEASE_VERSION}/INSTALL.md" \
            "dist/backend/${BACKEND_ARCHIVE}" dist/backend/SHA256SUMS

          # An unchanged extension version keeps its existing release and files.
          if gh release view "$CAPTURE_TAG" --json assets -q '.assets[].name' 2>/dev/null |
            grep -qxF "$EXTENSION_ARCHIVE"; then
            echo "$CAPTURE_TAG already has $EXTENSION_ARCHIVE"
          else
            publish_side_release "$CAPTURE_TAG" "Video Summary Capture ${EXTENSION_VERSION}" \
              "Video Summary Capture ${EXTENSION_VERSION}, the browser extension. Install: ${repo_url}/blob/${RELEASE_VERSION}/browser-extension/README.md" \
              "dist/capture/${EXTENSION_ARCHIVE}" dist/capture/SHA256SUMS
          fi

          notes_file=".release-tooling/docs/releases/${RELEASE_VERSION}.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="docs/releases/${RELEASE_VERSION}.md"
          fi
          notes_args=()
          if [[ -f "$notes_file" ]]; then
            cp "$notes_file" release-notes.md
          else
            : > release-notes.md
            notes_args+=(--generate-notes)
          fi
          {
            echo
            echo "## Other downloads"
            echo
            echo "- Backend: [${BACKEND_ARCHIVE}](${repo_url}/releases/download/${BACKEND_TAG}/${BACKEND_ARCHIVE}) (release [${BACKEND_TAG}](${repo_url}/releases/tag/${BACKEND_TAG}))"
            echo "- Browser extension: [${EXTENSION_ARCHIVE}](${repo_url}/releases/download/${CAPTURE_TAG}/${EXTENSION_ARCHIVE}) (release [${CAPTURE_TAG}](${repo_url}/releases/tag/${CAPTURE_TAG}))"
          } >> release-notes.md

          assets=(main.js manifest.json styles.css)
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" --verify-tag \
              --title "$RELEASE_VERSION" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create \
              "$RELEASE_VERSION" \
              "${assets[@]}" \
              --title "$RELEASE_VERSION" \
              --verify-tag \
              --latest \
              --notes-file release-notes.md \
              "${notes_args[@]}"
          fi
