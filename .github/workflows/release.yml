name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic-version tag to publish or retry
        required: true
        type: string

concurrency:
  group: video-summary-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  backend-image:
    # The prebuilt backend image the start script pulls, for Intel/AMD and Apple Silicon/ARM.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/rexxall/video-summary-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}

      - name: Check that the backend package points at this image
        run: |
          grep -qF "image: \${VS_IMAGE:-${IMAGE}:${RELEASE_VERSION}}" backend/compose.yaml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: backend-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Validate bundled workflow
        run: node tools/upgrade-workflow-v3.mjs --check

      - name: Build
        run: npm run build

      - name: Validate versions and committed bundle
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")"
          head_commit="$(git rev-parse "HEAD^{commit}")"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Checked-out ref is not tag $RELEASE_VERSION" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$head_commit" origin/main; then
            echo "Tag $RELEASE_VERSION is not reachable from origin/main" >&2
            exit 1
          fi

          node -e '
            const manifest = require("./manifest.json");
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            const versions = require("./versions.json");
            const tag = process.env.RELEASE_VERSION;
            const values = {
              manifest: manifest.version,
              package: pkg.version,
              lock: lock.version,
              lockRoot: lock.packages?.[""]?.version,
            };
            for (const [name, version] of Object.entries(values)) {
              if (version !== tag) {
                throw new Error(`${name} version ${version} does not match tag ${tag}`);
              }
            }
            if (versions[tag] !== manifest.minAppVersion) {
              throw new Error(
                `versions.json maps ${tag} to ${versions[tag]}, expected ${manifest.minAppVersion}`,
              );
            }
          '
          git diff --exit-code -- main.js

      - name: Package release assets
        run: |
          archive="video-summary-${RELEASE_VERSION}.zip"
          backend_archive="video-summary-backend-${RELEASE_VERSION}.zip"
          zip -j "$archive" main.js manifest.json styles.css
          test "$(unzip -Z1 "$archive" | sort | tr '\n' ' ')" = "main.js manifest.json styles.css "
          # Tracked files only, with their executable bits; .env and user files never ship.
          git archive --format=zip --prefix=video-summary-backend/ -o "$backend_archive" HEAD:backend
          unzip -l "$backend_archive" | grep -q 'video-summary-backend/.env.example'
          if unzip -Z1 "$backend_archive" | grep -E '/\.env$'; then
            echo "Backend archive must not contain .env" >&2
            exit 1
          fi
          extension_version="$(node -p "require('./browser-extension/manifest.json').version")"
          extension_archive="video-summary-capture-${extension_version}.zip"
          (cd browser-extension && zip -qr "../$extension_archive" . -x 'README.md')
          echo "EXTENSION_ARCHIVE=$extension_archive" >> "$GITHUB_ENV"
          sha256sum \
            main.js \
            manifest.json \
            styles.css \
            "$backend_archive" \
            "$archive" \
            "$extension_archive" \
            > SHA256SUMS

      - name: Checkout current release publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".release-tooling/docs/releases/${RELEASE_VERSION}.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="docs/releases/${RELEASE_VERSION}.md"
          fi
          assets=(
            main.js
            manifest.json
            styles.css
            "video-summary-${RELEASE_VERSION}.zip"
            "video-summary-backend-${RELEASE_VERSION}.zip"
            "$EXTENSION_ARCHIVE"
            SHA256SUMS
          )
          notes_args=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            edit_args=(--title "$RELEASE_VERSION")
            if [[ -f "$notes_file" ]]; then
              edit_args+=(--notes-file "$notes_file")
            fi
            gh release edit "$RELEASE_VERSION" --verify-tag "${edit_args[@]}"
            gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create \
              "$RELEASE_VERSION" \
              "${assets[@]}" \
              --title "$RELEASE_VERSION" \
              --verify-tag \
              "${notes_args[@]}"
          fi
