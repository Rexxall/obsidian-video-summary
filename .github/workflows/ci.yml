name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Pull requests opened by the yt-dlp update workflow do not trigger CI on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-summary-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Validate bundled workflow
        run: node tools/upgrade-workflow-v3.mjs --check

      - name: Build and verify committed bundle
        run: npm run build

      - name: Reject generated drift
        run: git diff --exit-code -- main.js
